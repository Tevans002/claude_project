<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Recursion Trees</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<select id="theme-switcher" aria-label="Choose theme">
  <option value="">Slate &amp; Amber (dark)</option>
  <option value="dusty-blue">Dusty Blue</option>
  <option value="soft-sage">Soft Sage</option>
  <option value="warm-sand">Warm Sand</option>
  <option value="plum-blush">Plum &amp; Blush</option>
</select>

<script>
(function () {
  var KEY = 'dsa-theme';
  var sel = document.getElementById('theme-switcher');
  var html = document.documentElement;

  function apply(theme) {
    if (theme) html.setAttribute('data-theme', theme);
    else       html.removeAttribute('data-theme');
    if (sel) sel.value = theme || '';
  }

  // Load saved theme as early as possible
  apply(localStorage.getItem(KEY) || '');

  if (sel) {
    sel.addEventListener('change', function () {
      var theme = sel.value;
      localStorage.setItem(KEY, theme);
      apply(theme);
    });
  }
})();
</script>

<body>
  <a class="home-link" href="../index.html">← Home</a>
  <h1>Recursion Trees</h1>

  <div class="panel eq-bar">
    <span id="eq"></span>
    <span>
      <button id="resetBtn">Reset</button>
      <button id="newBtn">New problem</button>
    </span>
  </div>

  <div class="panel">
    <div class="level-head">
      <span>Level ℓ</span><span>Nodes</span><span>Work at level ℓ</span>
    </div>
    <div id="tree">
      <svg id="edges"></svg>
      <div id="rows"></div>
    </div>
  </div>

  <div class="panel">
    <div id="prompt"></div>
    <div id="choices"></div>
    <div id="log"></div>
  </div>

  <div id="quiz" class="panel hidden"></div>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
